name: Verify Fly backend image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t evomon-api:test .
      - name: Start production image
        run: docker run --detach --name evomon-api --publish 127.0.0.1:8080:8080 evomon-api:test
      - name: Verify health, catalog, and CORS
        run: node scripts/verify-api.mjs http://127.0.0.1:8080
      - name: Show backend logs on failure
        if: failure()
        run: docker logs evomon-api
      - name: Stop test container
        if: always()
        run: docker rm --force evomon-api || true
