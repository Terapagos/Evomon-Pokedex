openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: evomon
    description: Evomon field-guide operations
paths:
  /evomon:
    get:
      operationId: getEvomonCatalog
      tags: [evomon]
      summary: Get the current Evomon field-guide catalog
      description: Returns the catalog sourced from the public Evomon Wiki, including normal and shiny data where the wiki has published it.
      responses:
        "200":
          description: Evomon catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvomonCatalog"
        "502":
          description: The Evomon Wiki could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
    StatBlock:
      type: object
      additionalProperties:
        type: number
    LegendaryTrait:
      type: object
      required: [name, effect]
      properties:
        name:
          type: string
        effect:
          type: string
    EvomonMove:
      type: object
      required:
        - name
        - element
        - category
        - description
        - obtained
        - unlockLevel
        - slot
        - power
        - uses
        - tags
      properties:
        name:
          type: string
        element:
          type: string
        category:
          type: string
        description:
          type: string
        obtained:
          type: [string, "null"]
        unlockLevel:
          type: [number, "null"]
        slot:
          type: string
        power:
          type: [string, "null"]
        uses:
          type: [number, "null"]
        tags:
          type: array
          items:
            type: string
            enum: [Physical, Sp. Atk, Support, Status condition, Weather, AoE, Single target]
    EvomonEntry:
      type: object
      required:
        - id
        - dexNumber
        - name
        - element
        - stage
        - baseStats
        - shinyBaseStats
        - shinyStatsRecorded
        - catchLocation
        - eventStatus
        - evolutionLine
        - moves
        - sourceUrl
      properties:
        id:
          type: string
        dexNumber:
          type: number
        name:
          type: string
        element:
          type: array
          items:
            type: string
        stage:
          type: string
        image:
          type: [string, "null"]
        shinyImage:
          type: [string, "null"]
        baseStats:
          $ref: "#/components/schemas/StatBlock"
        shinyBaseStats:
          $ref: "#/components/schemas/StatBlock"
        shinyStatsRecorded:
          type: boolean
        legendaryTrait:
          type: ["string", "null"]
        legendaryTraitEffect:
          type: ["string", "null"]
        catchLocation:
          type: string
        eventStatus:
          type: string
        evolutionLine:
          type: array
          items:
            type: string
        moves:
          type: array
          items:
            $ref: "#/components/schemas/EvomonMove"
        sourceUrl:
          type: string
    EvomonCatalog:
      type: object
      required: [source, traitsSource, movesSource, fetchedAt, mons]
      properties:
        source:
          type: string
        traitsSource:
          type: string
        movesSource:
          type: string
        fetchedAt:
          type: string
        mons:
          type: array
          items:
            $ref: "#/components/schemas/EvomonEntry"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

